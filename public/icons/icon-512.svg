<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0a0a0a"/>

  <!--
    Train icon centred in 512x512.
    Icon size: 210px (210/24 = 8.75 scale)
    Offset: (512 - 210) / 2 = 151
    Nudge up 10px to visually centre (train body is top-heavy).
  -->
  <g transform="translate(151, 141) scale(8.75)"
     fill="none" stroke="#ff9500" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"
     filter="url(#glow)">
    <rect width="16" height="16" x="4" y="3" rx="2"/>
    <path d="M4 11h16"/>
    <path d="M12 3v8"/>
    <path d="m8 19-2 3"/>
    <path d="m18 22-2-3"/>
    <path d="M8 15h.01"/>
    <path d="M16 15h.01"/>
  </g>
</svg>
