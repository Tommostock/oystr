<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Amber LED glow filter (matches OYSTR title glow) -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1024" height="1024" fill="#0a0a0a"/>

  <!--
    Lucide "Train" icon scaled to ~420px and centred.
    Original viewBox is 0 0 24 24.
    Scale factor: 420/24 = 17.5
    Centre offset: (1024 - 420) / 2 = 302
    Nudge down by 20px to visually centre (train body is top-heavy,
    the legs extend below the visual mass).
  -->
  <g transform="translate(302, 282) scale(17.5)"
     fill="none" stroke="#ff9500" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"
     filter="url(#glow)">
    <rect width="16" height="16" x="4" y="3" rx="2"/>
    <path d="M4 11h16"/>
    <path d="M12 3v8"/>
    <path d="m8 19-2 3"/>
    <path d="m18 22-2-3"/>
    <path d="M8 15h.01"/>
    <path d="M16 15h.01"/>
  </g>
</svg>
